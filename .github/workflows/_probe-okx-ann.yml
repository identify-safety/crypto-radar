name: _probe-okx-ann

# 临时探针 v2: 找出美国区 runner 上可用的获取"赚币活动"的方式 (用完即删)
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: probe v2
        run: |
          B='https://www.okx.com/api/v5'
          H='User-Agent: Mozilla/5.0'
          get() {
            local a="$1"
            local code
            code=$(curl -s --max-time 25 -o /tmp/b -w '%{http_code}' -H "$H" "$B/support/announcements?annType=$a&page=1&limit=20&lang=en-US")
            printf '%-40s HTTP %s | %s\n' "$a" "$code" "$(head -c 170 /tmp/b | tr '\n' ' ')"
            sleep 1.3
          }
          echo "=== runner IP ==="; curl -s --max-time 10 https://ifconfig.me; echo; sleep 1.3
          echo "=== annType 候选枚举 ==="
          for a in announcements-latest-events announcements-events announcements-earn announcements-campaigns announcements-promotions announcements-activities announcements-latest-activities announcements-latest-event announcements-jumpstart announcements-new-listings; do
            get "$a"
          done
          echo "=== 不带 annType 的 feed 分析 (page 1-3) ==="
          for p in 1 2 3; do
            curl -s --max-time 25 -H "$H" "$B/support/announcements?page=$p&limit=20&lang=en-US" -o /tmp/p$p
            sleep 1.3
            echo "--- page $p ---"
            jq -r '"totalPage=\(.data[0].totalPage)  n=\(.data[0].details|length)"' /tmp/p$p
            jq -r '.data[0].details[].annType' /tmp/p$p | sort | uniq -c | sed 's/^/    /'
            jq -r '.data[0].details[]|select(.title|test("arn|now live|Live"))|"    HIT \(.annType) | \(.title)"' /tmp/p$p
          done
          echo "=== done ==="
