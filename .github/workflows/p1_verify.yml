name: P1 Verify (TEMP)

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install asyncpg
        run: pip install asyncpg
      - name: Query Neon p1 tables
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python - <<'PY'
          import os, asyncio, re, asyncpg
          async def main():
              url = re.sub(r"[?&]sslmode=[^&]*", "", os.environ["DATABASE_URL"])
              conn = await asyncpg.connect(url, ssl="require", timeout=20)
              print("=== p1_state ===")
              rows = await conn.fetch("SELECT symbol, position, entry_date, entry_price, exit_date, exit_price, last_date, updated_at FROM p1_state ORDER BY symbol")
              print(" | ".join(rows[0].keys()) if rows else "(empty)")
              for r in rows:
                  print(" | ".join(str(r[k]) for k in r.keys()))
              print("")
              print("=== p1_log ===")
              rows2 = await conn.fetch("SELECT date, symbol, close, hh20, ll10, vol_ratio, signal, position, note FROM p1_log ORDER BY date DESC, symbol")
              print(" | ".join(rows2[0].keys()) if rows2 else "(empty)")
              for r in rows2:
                  print(" | ".join(str(r[k]) for k in r.keys()))
              print("")
              print("=== counts ===")
              print("p1_log rows      =", await conn.fetchval("SELECT count(*) FROM p1_log"))
              print("p1_state rows    =", await conn.fetchval("SELECT count(*) FROM p1_state"))
              print("radar_seen P1    =", await conn.fetchval("SELECT count(*) FROM radar_seen WHERE signal_type='P1'"))
              print("radar_runs last3 =")
              for r in await conn.fetch("SELECT finished_at, ok, scanned, signals, error FROM radar_runs ORDER BY finished_at DESC LIMIT 3"):
                  print("   ", " | ".join(str(r[k]) for k in r.keys()))
              await conn.close()
          asyncio.run(main())
          PY
